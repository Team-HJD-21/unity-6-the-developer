name: Daily Discord contributors

on:
  schedule:
    # Midnight Korea time; GitHub may delay scheduled starts under load.
    - cron: '0 0 * * *'
      timezone: Asia/Seoul
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a labeled test image without mentioning everyone'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-contributors
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install Pillow==12.3.0
      - name: Render and publish contributors
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_CONTRIBUTORS_WEBHOOK: ${{ secrets.DISCORD_CONTRIBUTORS_WEBHOOK }}
          CONTRIBUTORS_TEST_NOTIFICATION: ${{ inputs.test_notification && 'true' || 'false' }}
        run: python .github/scripts/publish_contributors.py --send

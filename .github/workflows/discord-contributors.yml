name: Daily Discord contributors

on:
  schedule:
    # 15:00 UTC = 00:00 Asia/Seoul the following day.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-contributors
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install Pillow==12.3.0
      - name: Render and publish contributors
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_CONTRIBUTORS_WEBHOOK: ${{ secrets.DISCORD_CONTRIBUTORS_WEBHOOK }}
        run: python .github/scripts/publish_contributors.py --send

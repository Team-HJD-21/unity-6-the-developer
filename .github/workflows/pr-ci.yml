name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_discord_notification:
        description: 'Send a labeled Discord test after checks (does not simulate a CI failure)'
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.23f1

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Validate Unity project and version
        shell: bash
        run: |
          set -euo pipefail

          for directory in Assets Packages ProjectSettings; do
            if [[ ! -d "$directory" ]]; then
              echo "::error::필수 Unity 폴더가 없습니다: $directory/"
              exit 1
            fi
          done

          for file in Packages/manifest.json Packages/packages-lock.json ProjectSettings/ProjectVersion.txt ProjectSettings/EditorBuildSettings.asset; do
            if [[ ! -f "$file" ]]; then
              echo "::error::필수 Unity 파일이 없습니다: $file"
              exit 1
            fi
          done

          actual_version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '\r')
          if [[ "$actual_version" != "$UNITY_VERSION" ]]; then
            echo "::error file=ProjectSettings/ProjectVersion.txt::Unity 버전이 다릅니다. expected=$UNITY_VERSION actual=$actual_version"
            exit 1
          fi

          grep -q 'm_SerializationMode: 2' ProjectSettings/EditorSettings.asset || {
            echo "::error file=ProjectSettings/EditorSettings.asset::Asset Serialization Mode를 Force Text로 설정하세요."
            exit 1
          }

          grep -q 'm_Mode: Visible Meta Files' ProjectSettings/VersionControlSettings.asset || {
            echo "::error file=ProjectSettings/VersionControlSettings.asset::Version Control Mode를 Visible Meta Files로 설정하세요."
            exit 1
          }

          echo "Unity project settings OK: $actual_version"

      - name: Validate enabled Build Scenes
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          scene_count=0

          while IFS= read -r scene; do
            [[ -z "$scene" ]] && continue
            scene_count=$((scene_count + 1))

            if [[ ! -f "$scene" ]]; then
              echo "::error file=ProjectSettings/EditorBuildSettings.asset::Build Settings의 Scene 파일이 없습니다: $scene"
              fail=1
            elif [[ ! -f "${scene}.meta" ]]; then
              echo "::error file=$scene::Build Scene의 .meta 파일이 없습니다: ${scene}.meta"
              fail=1
            else
              echo "Enabled scene: $scene"
            fi
          done < <(
            awk '
              /- enabled: 1/ { enabled = 1; next }
              enabled && /^[[:space:]]+path:/ {
                sub(/^[[:space:]]+path:[[:space:]]*/, "")
                print
                enabled = 0
              }
            ' ProjectSettings/EditorBuildSettings.asset
          )

          if [[ $scene_count -eq 0 ]]; then
            echo "::error file=ProjectSettings/EditorBuildSettings.asset::활성화된 Build Scene이 없습니다."
            fail=1
          fi

          exit "$fail"

      - name: Test Unity .meta validator
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate all Unity .meta pairs
        run: python3 -B .github/scripts/validate_meta.py

      - name: Validate submodule mappings
        shell: bash
        run: |
          set -euo pipefail
          if ! git submodule status; then
            echo "::error::Git submodule 연결이 잘못됐습니다. 중첩 저장소가 실수로 Commit됐는지 확인하세요."
            exit 1
          fi

      - name: Reject generated folders and merge conflict markers
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          generated=$(git ls-files | grep -E '^(Library|Temp|Logs|[Oo]bj|UserSettings|\.vs|\.idea)/' || true)
          if [[ -n "$generated" ]]; then
            echo "::error::Unity 또는 IDE 생성 파일이 Git에 포함돼 있습니다."
            echo "$generated"
            fail=1
          fi

          conflicts=$(git grep -n -I -E '^(<<<<<<< |=======|>>>>>>> )' -- Assets Packages ProjectSettings .github Docs README.md || true)
          if [[ -n "$conflicts" ]]; then
            echo "::error::해결되지 않은 Merge conflict 표시가 있습니다."
            echo "$conflicts"
            fail=1
          fi

          exit "$fail"

      - name: Warn about large Assets
        shell: bash
        run: |
          set -euo pipefail
          count=0

          while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            echo "::warning file=$file::50MB보다 큰 Asset입니다. Git LFS 적용 여부를 확인하세요. ($size bytes)"
            count=$((count + 1))
          done < <(find Assets -type f ! -name '*.meta' -size +50M -print0)

          echo "Large Asset warnings: $count"

  unity-validation:
    name: Unity EditMode test and Windows build
    needs: repository-checks
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true
          submodules: false

      - name: Check Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0

          for variable in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::GitHub Actions Secret이 없습니다: $variable"
              missing=1
            fi
          done

          exit "$missing"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Run Unity EditMode tests and compile
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: artifacts/editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode Tests

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: artifacts/editmode
          if-no-files-found: warn
          retention-days: 14

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: TheDeveloper
          buildsPath: build
          allowDirtyBuild: true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TheDeveloper-Windows
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 7

  notify-discord:
    name: Discord failure notification
    needs: [repository-checks, unity-validation]
    if: ${{ always() && (needs.repository-checks.result == 'failure' || needs.unity-validation.result == 'failure' || (github.event_name == 'workflow_dispatch' && inputs.test_discord_notification)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Discord webhook
        id: discord-webhook
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL Secret이 없어 Discord 실패 알림을 건너뜁니다."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send CI failure to Discord
        if: ${{ steps.discord-webhook.outputs.configured == 'true' }}
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY_CHECKS_RESULT: ${{ needs.repository-checks.result }}
          UNITY_VALIDATION_RESULT: ${{ needs.unity-validation.result }}
          IS_NOTIFICATION_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_discord_notification && 'true' || 'false' }}
        run: |
          set -euo pipefail
          short_sha="${COMMIT_SHA:0:7}"
          payload=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg event "$EVENT_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "$short_sha" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            --arg repository_checks "$REPOSITORY_CHECKS_RESULT" \
            --arg unity_validation "$UNITY_VALIDATION_RESULT" \
            --arg is_test "$IS_NOTIFICATION_TEST" \
            '{
              username: "The Developer CI",
              allowed_mentions: {parse: []},
              embeds: [{
                title: (if $is_test == "true" then "🧪 CI 알림 테스트" else "❌ PR CI 실패" end),
                url: $run_url,
                color: 15158332,
                description: (if $is_test == "true" then "**" + $repository + "**의 Discord 전송 경로 테스트입니다. 실제 CI 실패를 의미하지 않습니다." else "**" + $repository + "**에서 CI 오류가 발생했습니다." end),
                fields: [
                  {name: "Workflow", value: $workflow, inline: true},
                  {name: "Event", value: $event, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Commit", value: $sha, inline: true},
                  {name: "실행자", value: $actor, inline: true},
                  {name: "검사 결과", value: ("Repository: " + $repository_checks + "\nUnity: " + $unity_validation), inline: false}
                ],
                footer: {text: "실행 결과를 열어 Annotations와 실패한 Step을 확인하세요."}
              }]
            }')

          if [[ "$DISCORD_WEBHOOK_URL" == *\?* ]]; then
            delivery_url="${DISCORD_WEBHOOK_URL}&wait=true"
          else
            delivery_url="${DISCORD_WEBHOOK_URL}?wait=true"
          fi
          if ! response=$(curl --fail-with-body --silent --retry 2 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$delivery_url"); then
            echo "::error::Discord 알림 전송에 실패했습니다. Webhook 주소와 응답 내용은 출력하지 않습니다."
            exit 1
          fi
          echo "$response" | jq -er '"Discord confirmed message " + .id'

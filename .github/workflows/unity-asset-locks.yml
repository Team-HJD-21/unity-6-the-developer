name: Release merged Unity asset locks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-asset-lock-smoke-pat
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/unity-lfs-actions-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diagnostic/unity-lfs-actions-auth
          fetch-depth: 0
          sparse-checkout: .github/scripts
          token: ${{ secrets.UNITY_ASSET_LOCKS_TOKEN || github.token }}
      - name: Use the production token to release only the fixture
        env:
          LOCKS_CONFIGURED: ${{ secrets.UNITY_ASSET_LOCKS_TOKEN != '' }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          PYTHONPATH=.github/scripts python3 -u - <<'PY'
          import release_unity_asset_locks as release

          fixture = "Assets/Diagnostics/__CodexUnityLockSmoke_45867295374.prefab"
          lock_id = "65307884"
          test_ref = "refs/heads/diagnostic/unity-lfs-actions-auth"
          implementation = release.git

          def isolate_test_ref(*args, **kwargs):
              if args[0] == "ls-remote":
                  return implementation("ls-remote", "--refs", "origin", test_ref, args[-1]).replace(test_ref, "refs/heads/main")
              return implementation(*args, **kwargs)

          class FixtureOnly(release.GitLfsLocks):
              def list_locks(self):
                  return [lock for lock in super().list_locks() if str(lock["id"]) == lock_id and lock["path"] == fixture]

              def unlock(self, requested_id):
                  assert requested_id == lock_id, "The smoke test may only release its own fixture lock."
                  super().unlock(requested_id)

          import os
          if os.environ.get("LOCKS_CONFIGURED") != "true":
              raise SystemExit("The production repository secret is missing.")
          release.git = isolate_test_ref
          api = FixtureOnly()
          before = api.list_locks()
          assert len(before) == 1 and before[0].get("owner", {}).get("name") == "hjd5031", "The fixture lock must be present and owned by hjd5031."
          print(f"BEFORE: LFS lock {lock_id} is present and owned by hjd5031.")
          tag = release.submission_tag(lock_id, release.blob(implementation("rev-parse", "HEAD"), fixture))
          assert implementation("ls-remote", "--refs", "origin", tag), "The fixture's exact submission tag must be present."
          print("BEFORE: the fixture submission tag exists.")
          release.release_merged_locks(api)
          assert not api.list_locks(), "LFS still reports the fixture lock."
          assert not implementation("ls-remote", "--refs", "origin", tag), "Git still reports the fixture tag."
          print(f"AFTER: LFS lock {lock_id} and its submission tag are both absent from the remote.")
          PY

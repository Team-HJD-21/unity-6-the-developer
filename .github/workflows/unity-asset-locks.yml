name: Release merged Unity asset locks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-asset-lock-smoke-pat
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/unity-lfs-actions-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diagnostic/unity-lfs-actions-auth
          fetch-depth: 0
          sparse-checkout: .github/scripts
          token: ${{ secrets.UNITY_ASSET_LOCKS_TOKEN || github.token }}
      - name: Compare effective token identity and repository role
        env:
          GH_TOKEN: ${{ secrets.UNITY_ASSET_LOCKS_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          python3 -u - <<'PY'
          import json
          import os
          import subprocess

          def github(path):
              run = subprocess.run(["gh", "api", path], capture_output=True, text=True, timeout=15)
              return json.loads(run.stdout) if run.returncode == 0 else None

          token = os.environ["GH_TOKEN"]
          kind = "fine-grained" if token.startswith("github_pat_") else "classic" if token.startswith("ghp_") else "other"
          user = github("user")
          repository = github("repos/" + os.environ["GITHUB_REPOSITORY"])
          rights = repository.get("permissions", {}) if repository else {}
          print(f"TOKEN: type={kind}, actorIsFixtureOwner={user is not None and user.get('login') == 'hjd5031'}, repoAdmin={rights.get('admin')}, repoPush={rights.get('push')}.")
          id_match = "65307884"
          result = subprocess.run(["git", "lfs", "locks", "--remote=origin"], capture_output=True, text=True, timeout=25)
          print(f"LFS list: exit={result.returncode}, fixtureFound={id_match in result.stdout}.")
          tag = "refs/tags/unity-asset-locks/9d7f29eb9f960ed526408f0787c6980f358e7be42382d19abf2294019cbb9936/725cda97312acc447eeacd6744c3a3073fc122cd"
          anchor = "eeb4e6b6ff8d7038a0eed3e1847bffa299da3b3b"
          push = subprocess.run(["git", "push", "--dry-run", "--no-verify", f"--force-with-lease={tag}:{anchor}", "origin", f":{tag}"], capture_output=True, text=True, timeout=25)
          print(f"Git tag transport dry run: exit={push.returncode}.")
          PY

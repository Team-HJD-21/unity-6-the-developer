name: Release merged Unity asset locks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-asset-lock-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: .github/scripts
          token: ${{ secrets.UNITY_ASSET_LOCKS_TOKEN || github.token }}
      - name: Release submitted versions on main
        env:
          LOCKS_TOKEN: ${{ secrets.UNITY_ASSET_LOCKS_TOKEN }}
        run: python3 .github/scripts/release_unity_asset_locks.py

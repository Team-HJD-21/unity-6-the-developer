name: Release merged Unity asset locks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-asset-lock-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/unity-lfs-actions-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diagnostic/unity-lfs-actions-auth
          fetch-depth: 0
          sparse-checkout: .github/scripts
          token: ${{ secrets.UNITY_ASSET_LOCKS_TOKEN || github.token }}
      - name: Release submitted versions on main
        env:
          LOCKS_CONFIGURED: ${{ secrets.UNITY_ASSET_LOCKS_TOKEN != '' }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          PYTHONPATH=.github/scripts python3 -u - <<'PY'
          import release_unity_asset_locks as release

          fixture = "Assets/Diagnostics/__CodexUnityLockSmoke_45867295374.prefab"
          lock_id = "65307884"
          ref = "refs/heads/diagnostic/unity-lfs-actions-auth"
          implementation = release.git

          def isolate_test_branch(*args, **kwargs):
              if args[0] == "ls-remote":
                  return implementation("ls-remote", "--refs", "origin", ref, args[-1]).replace(ref, "refs/heads/main")
              return implementation(*args, **kwargs)

          class FixtureOnly(release.GitLfsLocks):
              def list_locks(self):
                  return [lock for lock in super().list_locks() if str(lock["id"]) == lock_id and lock["path"] == fixture]

              def unlock(self, requested_id):
                  assert requested_id == lock_id, "The smoke test may only release its own fixture lock."
                  super().unlock(requested_id)

          release.git = isolate_test_branch
          import os
          import subprocess
          probe = subprocess.run(["git", "push", "--dry-run", "--no-verify", "origin", "HEAD:refs/heads/diagnostic/unity-lfs-actions-auth"], capture_output=True, timeout=30)
          print(f"Repository Git write transport check: exit={probe.returncode}.", flush=True)
          assert os.environ.get("LOCKS_CONFIGURED") == "true", "Configure the existing repository secret before running this fixture."
          api = FixtureOnly()
          before = api.list_locks()
          assert len(before) == 1 and before[0].get("owner", {}).get("name") == "hjd5031", "Fixture lock was not visible with the original owner."
          print(f"BEFORE: remote lock {lock_id} is present, owned by hjd5031.", flush=True)
          tag = release.submission_tag(lock_id, release.blob(implementation("rev-parse", "HEAD"), fixture))
          assert implementation("ls-remote", "--refs", "origin", tag), "Fixture submission tag must exist before release."
          release.release_merged_locks(api)
          assert not api.list_locks(), "The remote still reports the fixture lock."
          assert not implementation("ls-remote", "--refs", "origin", tag), "The remote still reports the fixture tag."
          print(f"AFTER: remote lock {lock_id} and its submission tag are both gone.", flush=True)
          PY
